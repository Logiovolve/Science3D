<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>多角撮影＆背景カット AR風オブジェクト表示Web</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    body { touch-action: manipulation; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
    .canvas-container canvas { touch-action: none; }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col p-3">

  <!-- ヘッダー -->
  <header class="p-2 border-b border-slate-700 flex justify-between items-center mb-2">
    <h1 class="text-sm md:text-base font-bold text-indigo-400">AR風 全方向写真オブジェクト化</h1>
    <span class="text-xs bg-indigo-900 text-indigo-200 px-2.5 py-0.5 rounded-full">上下左右・多角撮影</span>
  </header>

  <!-- メインレイアウト -->
  <main class="flex-1 max-w-6xl w-full mx-auto grid grid-cols-1 md:grid-cols-3 gap-3">

    <!-- 左側：多方向撮影ガイド ＆ パネル -->
    <div class="bg-slate-800 p-3 rounded-2xl border border-slate-700 flex flex-col space-y-3">
      
      <!-- 撮影ガイド指示 -->
      <div class="bg-slate-900 p-3 rounded-xl border border-slate-700">
        <div class="text-xs text-indigo-300 font-bold mb-1">現在の撮影指示:</div>
        <div id="guideInstruction" class="text-sm font-extrabold text-amber-300">
          ① 【正面】から撮影してください
        </div>
        <div class="text-[10px] text-slate-400 mt-1">※背景と物体の境目がわかりやすい場所（白い紙の上など）で撮ると綺麗に切り抜けます。</div>
      </div>

      <!-- カメラ起動 ＆ 連続撮影ボタン -->
      <div class="space-y-2">
        <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoCapture(event)">
        <label for="cameraInput" id="captureBtnLabel" class="w-full bg-indigo-600 active:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl text-xs flex items-center justify-center space-x-2 cursor-pointer shadow">
          <span>📷 ガイドに合わせて撮影する</span>
        </label>
      </div>

      <!-- 撮影済みアングル一覧 -->
      <div class="flex-1 flex flex-col">
        <div class="text-xs font-bold text-slate-300 mb-1 flex justify-between">
          <span>取得済みアングル</span>
          <span id="angleCount" class="text-indigo-400">0 / 5 方向</span>
        </div>
        <div id="angleGrid" class="grid grid-cols-3 gap-1.5 p-2 bg-slate-950 rounded-xl border border-slate-800 min-h-[100px]">
          <span class="col-span-3 text-[11px] text-slate-500 text-center self-center">撮影した画像（切り抜き済）が追加されます</span>
        </div>
      </div>

      <!-- 背景カット ＆ AR風オブジェクト化実行 -->
      <button id="generateARBtn" onclick="generateARObject()" disabled class="w-full bg-emerald-600 active:bg-emerald-700 disabled:bg-slate-700 disabled:text-slate-500 text-white font-bold py-3 rounded-xl text-xs transition shadow">
        ✨ 背景を切り抜いてARオブジェクト化
      </button>
    </div>

    <!-- 右側：AR風3D空間ビューア -->
    <div class="md:col-span-2 bg-slate-950 rounded-2xl border border-slate-800 relative overflow-hidden flex flex-col min-h-[380px]">
      
      <!-- 3D 描画コンテナ -->
      <div id="webglContainer" class="canvas-container w-full h-full flex-1"></div>

      <!-- AR操作用ヒント -->
      <div class="absolute bottom-3 left-3 bg-slate-900/90 backdrop-blur-md px-3 py-1.5 rounded-lg text-[11px] text-slate-300 border border-slate-700 pointer-events-none">
        👉 指でくるくる回して、上下左右全方向から「立体オブジェクト」として観察できます
      </div>

      <!-- AR環境ライトコントロール -->
      <div class="absolute top-3 right-3 bg-slate-900/80 backdrop-blur-md px-3 py-1.5 rounded-lg text-xs text-indigo-300 border border-slate-700 font-bold">
        AR立体表示モード: <span id="arStatusText" class="text-emerald-400">待機中</span>
      </div>
    </div>

  </main>

  <script>
    let scene, camera, renderer, controls;
    let arObjectGroup = null;

    // 撮影ガイドのステップ（正面、右、左、上、下）
    const captureSteps = [
      { name: "① 【正面】から撮影してください", tag: "正面" },
      { name: "② 【右側】から横顔を撮影してください", tag: "右" },
      { name: "③ 【左側】から横顔を撮影してください", tag: "左" },
      { name: "④ 【真上（斜め上）】から覗き込んで撮影してください", tag: "上" },
      { name: "⑤ 【真下（斜め下）】から見上げるように撮影してください", tag: "下" }
    ];
    let currentStepIndex = 0;
    const capturedPhotos = [];

    window.addEventListener('DOMContentLoaded', () => {
      initThreeJS();
    });

    function initThreeJS() {
      const container = document.getElementById('webglContainer');
      const width = container.clientWidth || window.innerWidth;
      const height = container.clientHeight || 380;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x020617);

      camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
      camera.position.set(0, 10, 25);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(width, height);
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

      // ライト
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
      dirLight.position.set(10, 20, 15);
      scene.add(dirLight);

      // 床面 ARグリッド
      const grid = new THREE.GridHelper(30, 12, 0x334155, 0x1e293b);
      grid.position.y = -6;
      scene.add(grid);

      window.addEventListener('resize', onWindowResize, false);
      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      if (controls) controls.update();
      if (arObjectGroup) arObjectGroup.rotation.y += 0.003; // AR風にゆっくり自転
      if (renderer && scene && camera) renderer.render(scene, camera);
    }

    function onWindowResize() {
      const container = document.getElementById('webglContainer');
      if (!container || !renderer || !camera) return;
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    // 写真撮影 ＆ クロマキー背景簡易自動カット（グリーン/白背景の切り抜き処理）
    function handlePhotoCapture(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          // 背景除去（自動クロマキー・明度閾値処理）
          const cutCanvas = document.createElement('canvas');
          cutCanvas.width = img.width;
          cutCanvas.height = img.height;
          const ctx = cutCanvas.getContext('2d');
          ctx.drawImage(img, 0, 0);

          const imgData = ctx.getImageData(0, 0, cutCanvas.width, cutCanvas.height);
          const data = imgData.data;

          // 簡易背景透過アルゴリズム（背景の極端に明るい部分/暗い部分を透過させる処理）
          for (let i = 0; i < data.length; i += 4) {
            const r = data[i], g = data[i+1], b = data[i+2];
            // 明るい背景（白・ライトグレー）をアルファ値0（透明）にする
            if (r > 220 && g > 220 && b > 220) {
              data[i + 3] = 0; 
            }
          }
          ctx.putImageData(imgData, 0, 0);

          const processedDataUrl = cutCanvas.toDataURL('image/png');
          
          // 写真配列へ保存
          capturedPhotos.push({
            tag: captureSteps[currentStepIndex].tag,
            src: processedDataUrl
          });

          // サムネイル表示
          renderThumbnails();

          // ガイドを進める
          currentStepIndex++;
          if (currentStepIndex < captureSteps.length) {
            document.getElementById('guideInstruction').innerText = captureSteps[currentStepIndex].name;
          } else {
            document.getElementById('guideInstruction').innerText = "全方向（上下左右・正面）の撮影が完了しました！";
          }

          document.getElementById('angleCount').innerText = `${capturedPhotos.length} / 5 方向`;
          if (capturedPhotos.length >= 2) {
            document.getElementById('generateARBtn').disabled = false;
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function renderThumbnails() {
      const grid = document.getElementById('angleGrid');
      if (capturedPhotos.length === 1) grid.innerHTML = '';

      const lastPhoto = capturedPhotos[capturedPhotos.length - 1];
      const card = document.createElement('div');
      card.className = 'relative bg-slate-900 border border-slate-700 rounded-lg p-1 flex flex-col items-center';
      card.innerHTML = `
        <img src="${lastPhoto.src}" class="w-12 h-12 object-contain bg-slate-950/80 rounded" />
        <span class="text-[9px] font-bold text-indigo-300 mt-1">${lastPhoto.tag}</span>
      `;
      grid.appendChild(card);
    }

    // 上下左右の写真から「立体AR風オブジェクト」を構築
    function generateARObject() {
      if (arObjectGroup) scene.remove(arObjectGroup);

      arObjectGroup = new THREE.Group();
      const textureLoader = new THREE.TextureLoader();

      capturedPhotos.forEach(photo => {
        const texture = textureLoader.load(photo.src);
        texture.transparent = true;

        // 写真カード用プレーン（透明板）
        const geometry = new THREE.PlaneGeometry(8, 8);
        const material = new THREE.MeshStandardMaterial({
          map: texture,
          transparent: true,
          side: THREE.DoubleSide,
          alphaTest: 0.1
        });

        const plane = new THREE.Mesh(geometry, material);

        // 撮影アングルに応じて立体空間に配置（全方向をカバー）
        if (photo.tag === '正面') plane.position.set(0, 0, 2);
        if (photo.tag === '右') { plane.position.set(2, 0, 0); plane.rotation.y = Math.PI / 2; }
        if (photo.tag === '左') { plane.position.set(-2, 0, 0); plane.rotation.y = -Math.PI / 2; }
        if (photo.tag === '上') { plane.position.set(0, 2, 0); plane.rotation.x = -Math.PI / 2; }
        if (photo.tag === '下') { plane.position.set(0, -2, 0); plane.rotation.x = Math.PI / 2; }

        arObjectGroup.add(plane);
      });

      scene.add(arObjectGroup);
      document.getElementById('arStatusText').innerText = "生成完了・立体表示中";
    }
  </script>
</body>
</html>
