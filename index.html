<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>連続撮影・指示ガイド付き 立体写真作成アプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* カメラ・キャンバスの重なり */
    .viewport-box {
      position: relative;
      width: 100%;
      height: 360px;
      background-color: #000;
      border-radius: 1rem;
      overflow: hidden;
    }
    video, canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col p-4 select-none">

  <!-- ヘッダー -->
  <header class="mb-3 text-center">
    <h1 class="text-base font-bold text-indigo-400">連続撮影 3D立体写真ジェネレーター</h1>
    <p class="text-xs text-slate-400">上書きなし！ガイドに合わせて複数枚撮影</p>
  </header>

  <!-- メインエリア -->
  <main class="max-w-md w-full mx-auto flex-1 flex flex-col space-y-3">

    <!-- カメラ＆ガイド表示エリア -->
    <div class="viewport-box border-2 border-indigo-500/50 shadow-lg">
      
      <!-- カメラ映像 -->
      <video id="cameraVideo" autoplay playsinline muted class="block"></video>
      
      <!-- 3D写真プレビューキャンバス（合成後） -->
      <canvas id="photo3DCanvas" class="hidden"></canvas>

      <!-- 撮影方向のガイド指示オーバーレイ -->
      <div id="guideOverlay" class="absolute inset-0 flex flex-col justify-between p-4 pointer-events-none bg-black/20">
        <div class="bg-indigo-600/90 text-white text-xs font-bold px-3 py-1.5 rounded-full self-center backdrop-blur-sm shadow">
          指示: <span id="guideText" class="text-amber-300 font-extrabold text-sm">① 正面から撮ってください</span>
        </div>
        
        <!-- 画面中央のガイド枠 -->
        <div class="border-2 border-dashed border-white/60 rounded-2xl w-48 h-48 self-center flex items-center justify-center">
          <span class="text-white/40 text-xs">ここに観察物をあわせる</span>
        </div>

        <div class="text-center text-[11px] text-white/80 bg-black/40 py-1 rounded">
          撮影枚数: <span id="photoCount" class="font-bold text-emerald-400">0</span> / 3 枚
        </div>
      </div>
    </div>

    <!-- カメラ起動＆シャッター操作部 -->
    <div class="bg-slate-800 p-3 rounded-2xl border border-slate-700 space-y-3">
      
      <div class="flex gap-2">
        <!-- カメラスタートボタン -->
        <button id="startCamBtn" onclick="startCamera()" class="flex-1 bg-slate-700 active:bg-slate-600 text-white py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-1">
          <span>📷 カメラを起動</span>
        </button>

        <!-- シャッターボタン -->
        <button id="snapBtn" onclick="takePhotoStep()" disabled class="flex-2 bg-indigo-600 active:bg-indigo-700 disabled:bg-slate-700 disabled:text-slate-500 text-white font-bold py-2.5 px-6 rounded-xl text-xs transition shadow flex items-center justify-center space-x-2">
          <span>📸 写真を撮る</span>
        </button>
      </div>

      <!-- 撮影済み写真のプレビュー（上書きされず並ぶ） -->
      <div>
        <div class="text-[11px] text-slate-400 mb-1 font-bold">撮影した写真（自動保持）</div>
        <div id="thumbGrid" class="flex space-x-2 overflow-x-auto p-1.5 bg-slate-900 rounded-xl min-h-[60px] border border-slate-700">
          <span class="text-[10px] text-slate-500 self-center mx-auto">ここに撮影した写真が追加されます</span>
        </div>
      </div>

      <!-- 3D写真合成ボタン -->
      <button id="build3DBtn" onclick="build3DPhoto()" disabled class="w-full bg-emerald-600 active:bg-emerald-700 disabled:bg-slate-700 disabled:text-slate-500 text-white font-bold py-3 rounded-xl text-xs transition shadow">
        ✨ 撮影した写真から立体（3D）写真を作る
      </button>
    </div>

  </main>

  <script>
    let videoStream = null;
    let capturedImages = []; // 撮影した写真を保持する配列（上書き防止）
    
    // 撮影方向の指示ステップ
    const steps = [
      "① 正面から撮ってください",
      "② 少し【右側】から撮ってください",
      "③ 少し【上から（斜め上）】撮ってください"
    ];
    let currentStep = 0;

    // カメラ起動（iPadのインカメラ/アウトカメラ自動取得）
    async function startCamera() {
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" } }, // 背面カメラを優先
          audio: false
        });
      } catch (e) {
        // 背面カメラが取れない場合は標準カメラ
        videoStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      }

      const video = document.getElementById('cameraVideo');
      video.srcObject = videoStream;
      
      document.getElementById('startCamBtn').classList.add('bg-emerald-700');
      document.getElementById('snapBtn').disabled = false;
      updateGuide();
    }

    // ガイドテキスト更新
    function updateGuide() {
      if (currentStep < steps.length) {
        document.getElementById('guideText').innerText = steps[currentStep];
      } else {
        document.getElementById('guideText').innerText = "準備完了！「立体写真を作る」を押してください";
      }
      document.getElementById('photoCount').innerText = capturedImages.length;
    }

    // シャッター（写真撮影＆保持）
    function takePhotoStep() {
      const video = document.getElementById('cameraVideo');
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // 写真データ（DataURL）を取得して配列に追加（★ここで上書きを防ぐ）
      const imgData = canvas.toDataURL('image/jpeg');
      capturedImages.push(imgData);

      // サムネイル追加
      const grid = document.getElementById('thumbGrid');
      if (capturedImages.length === 1) grid.innerHTML = ''; // 最初だけメッセージ消去

      const imgEl = document.createElement('img');
      imgEl.src = imgData;
      imgEl.className = 'w-12 h-12 object-cover rounded-lg border border-indigo-400 flex-shrink-0';
      grid.appendChild(imgEl);

      currentStep++;
      updateGuide();

      // 3枚以上撮れたら合成可能に
      if (capturedImages.length >= 2) {
        document.getElementById('build3DBtn').disabled = false;
      }
    }

    // 立体（3D）写真の合成と擬似立体表示
    function build3DPhoto() {
      const video = document.getElementById('cameraVideo');
      const canvas = document.getElementById('photo3DCanvas');
      const ctx = canvas.getContext('2d');

      video.classList.add('hidden');
      canvas.classList.remove('hidden');

      canvas.width = 640;
      canvas.height = 480;

      // 撮影した写真を読み込み
      const img1 = new Image();
      const img2 = new Image();
      img1.src = capturedImages[0]; // 正面
      img2.src = capturedImages[1]; // 右/上視点

      img2.onload = () => {
        let mouseX = 0;
        
        // タッチ移動で写真をずらし、手前と奥の視差（立体感）を作る
        canvas.addEventListener('touchmove', (e) => {
          const touch = e.touches[0];
          const rect = canvas.getBoundingClientRect();
          mouseX = (touch.clientX - rect.left) / rect.width - 0.5;
          renderStereoEffect(ctx, img1, img2, mouseX);
        });

        // 初期描画
        renderStereoEffect(ctx, img1, img2, 0);
      };

      alert("立体写真が完成しました！\n画面上の写真を指で左右に触ると、奥と手前がずれて立体的に見えます。");
    }

    // 視差レンダリング（立体写真効果）
    function renderStereoEffect(ctx, img1, img2, offset) {
      ctx.clearRect(0, 0, 640, 480);
      
      // 背景（1枚目の写真）
      ctx.globalAlpha = 1.0;
      ctx.drawImage(img1, 0, 0, 640, 480);

      // 2枚目の写真をずらして半透明重ね合わせ（赤青メガネなしでも深みが現れる立体視処理）
      ctx.globalAlpha = 0.4;
      const shiftX = offset * 30; // 指の動きに合わせてずらす
      ctx.drawImage(img2, shiftX, 0, 640, 480);
    }
  </script>
</body>
</html>
