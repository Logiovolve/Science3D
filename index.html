<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI全自動背景削除 3D立体観察アプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- Google MediaPipe AI -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.js" crossorigin="anonymous"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col p-3">

  <header class="p-2 border-b border-slate-700 flex justify-between items-center mb-2">
    <h1 class="text-sm md:text-base font-bold text-indigo-400">AI完全自動セグメンテーション 3D観察</h1>
    <span id="aiStatusBadge" class="text-xs bg-amber-900 text-amber-200 px-2.5 py-0.5 rounded-full font-bold">AIエンジンロード中...</span>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto grid grid-cols-1 md:grid-cols-3 gap-3">
    <div class="bg-slate-800 p-3 rounded-2xl border border-slate-700 flex flex-col space-y-3">
      <div class="bg-slate-900 p-3 rounded-xl border border-slate-700">
        <div id="guideInstruction" class="text-sm font-extrabold text-amber-300">
          ① 【正面】から対象物を撮影してください
        </div>
      </div>

      <div>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoCapture(event)" disabled>
        <label id="captureBtnLabel" for="cameraInput" class="w-full bg-slate-700 text-slate-400 font-bold py-3 px-4 rounded-xl text-xs flex items-center justify-center space-x-2 shadow transition cursor-not-allowed">
          <span id="btnText">📷 AIの起動をお待ちください</span>
        </label>
      </div>

      <div class="flex-1 flex flex-col">
        <div id="photoListGrid" class="grid grid-cols-2 gap-2 p-2 bg-slate-950 rounded-xl border border-slate-800 min-h-[140px] max-h-[220px] overflow-y-auto">
          <span class="col-span-2 text-[11px] text-slate-500 text-center self-center">撮影するとAIが背景を自動消去します</span>
        </div>
      </div>

      <button id="generateARBtn" onclick="build3DARScene()" disabled class="w-full bg-emerald-600 disabled:bg-slate-700 disabled:text-slate-500 text-white font-bold py-3 rounded-xl text-xs transition shadow flex items-center justify-center space-x-1">
        <span>✨ 3D立体表示（回転観察）</span>
      </button>
    </div>

    <div class="md:col-span-2 bg-slate-950 rounded-2xl border border-slate-800 relative overflow-hidden flex flex-col min-h-[380px]">
      <div id="webglContainer" class="w-full h-full flex-1"></div>
    </div>
  </main>

  <script>
    let scene, camera, renderer, controls;
    let spriteMeshMap = {}; 
    let activeSprite = null;
    let imageSegmenter = null;

    const captureSteps = [
      { name: "① 【正面】から撮影してください", tag: "正面" },
      { name: "② 【右側】から撮影してください", tag: "右" },
      { name: "③ 【左側】から撮影してください", tag: "左" },
      { name: "④ 【真上】から撮影してください", tag: "上" }
    ];
    let capturedPhotos = []; 
    let photoIdCounter = 0;

    window.addEventListener('DOMContentLoaded', () => {
      initThreeJS();
      initMediaPipeAI();
    });

    async function initMediaPipeAI() {
      try {
        const { ImageSegmenter, FilesetResolver } = vision;
        const filesetResolver = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
        );

        // iPadフリーズ対策: delegateを "GPU" から "CPU" に変更
        imageSegmenter = await ImageSegmenter.createFromOptions(filesetResolver, {
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/image_segmenter/deeplab_v3/float32/1/deeplab_v3.tflite",
            delegate: "CPU" 
          },
          outputCategoryMask: true,
          outputConfidenceMasks: false
        });

        const badge = document.getElementById('aiStatusBadge');
        badge.innerText = "AIエンジン稼働中 (CPU互換モード)";
        badge.className = "text-xs bg-emerald-900 text-emerald-200 px-2.5 py-0.5 rounded-full font-bold";

        const btnLabel = document.getElementById('captureBtnLabel');
        btnLabel.className = "w-full bg-indigo-600 active:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl text-xs flex items-center justify-center space-x-2 cursor-pointer shadow transition";
        document.getElementById('btnText').innerText = "📷 写真を撮影する（AI自動切抜）";
        document.getElementById('cameraInput').disabled = false;

      } catch (e) {
        console.error("AIロードエラー:", e);
        document.getElementById('aiStatusBadge').innerText = "AI通信エラー";
        document.getElementById('btnText').innerText = "エラー: " + e.message;
      }
    }

    function initThreeJS() {
      const container = document.getElementById('webglContainer');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 0, 20);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      const grid = new THREE.GridHelper(30, 12, 0x1e293b, 0x0f172a);
      grid.position.y = -5;
      scene.add(grid);

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      if (controls) controls.update();
      if (activeSprite && camera) updateActiveAngleView(Math.atan2(camera.position.x, camera.position.z));
      renderer.render(scene, camera);
    }

    function handlePhotoCapture(event) {
      const file = event.target.files[0];
      if (!file) return;

      document.getElementById('aiStatusBadge').innerText = "AI解析中...";
      
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => runAISegmentation(img);
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
      event.target.value = '';
    }

    function runAISegmentation(imgElement) {
      imageSegmenter.segment(imgElement, (result) => {
        const mask = result.categoryMask;
        const canvas = document.createElement('canvas');
        canvas.width = mask.width;
        canvas.height = mask.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(imgElement, 0, 0);

        const imgData = ctx.getImageData(0, 0, mask.width, mask.height);
        const pixels = imgData.data;
        const maskData = mask.getAsUint8Array();

        for (let i = 0; i < maskData.length; i++) {
          if (maskData[i] === 0) pixels[i * 4 + 3] = 0;
        }
        ctx.putImageData(imgData, 0, 0);

        const step = captureSteps[Math.min(capturedPhotos.length, captureSteps.length - 1)];
        capturedPhotos.push({
          id: ++photoIdCounter,
          tag: step.tag,
          processedSrc: canvas.toDataURL('image/png')
        });

        document.getElementById('aiStatusBadge').innerText = "AIエンジン稼働中 (CPU互換モード)";
        updatePhotoListUI();
      });
    }

    function updatePhotoListUI() {
      const grid = document.getElementById('photoListGrid');
      grid.innerHTML = '';
      capturedPhotos.forEach((photo, idx) => {
        const div = document.createElement('div');
        div.className = 'bg-slate-900 border border-slate-700 rounded-lg p-1.5 flex items-center space-x-2';
        div.innerHTML = `<img src="${photo.processedSrc}" class="w-10 h-10 object-contain rounded bg-slate-950"/>
                         <div class="text-[10px] text-indigo-300">${idx + 1}. ${photo.tag}</div>`;
        grid.appendChild(div);
      });
      document.getElementById('generateARBtn').disabled = capturedPhotos.length === 0;
      
      const guide = document.getElementById('guideInstruction');
      guide.innerText = capturedPhotos.length < captureSteps.length ? captureSteps[capturedPhotos.length].name : "撮影完了！「3D立体表示」を押してください。";
    }

    function build3DARScene() {
      scene.children = scene.children.filter(c => c.type !== 'Sprite');
      spriteMeshMap = {};
      
      const loader = new THREE.TextureLoader();
      capturedPhotos.forEach(photo => {
        const mat = new THREE.SpriteMaterial({ map: loader.load(photo.processedSrc), transparent: true });
        const sprite = new THREE.Sprite(mat);
        sprite.scale.set(8, 8, 1);
        spriteMeshMap[photo.tag] = sprite;
      });

      if (capturedPhotos.length > 0) {
        activeSprite = spriteMeshMap[capturedPhotos[0].tag];
        scene.add(activeSprite);
      }
    }

    function updateActiveAngleView(theta) {
      if (!spriteMeshMap || Object.keys(spriteMeshMap).length === 0) return;
      let selectedTag = '正面';
      if (theta > 0.78 && theta < 2.35 && spriteMeshMap['右']) selectedTag = '右';
      else if (theta < -0.78 && theta > -2.35 && spriteMeshMap['左']) selectedTag = '左';
      else if ((theta >= 2.35 || theta <= -2.35) && spriteMeshMap['上']) selectedTag = '上';

      if (spriteMeshMap[selectedTag] && activeSprite !== spriteMeshMap[selectedTag]) {
        scene.remove(activeSprite);
        activeSprite = spriteMeshMap[selectedTag];
        scene.add(activeSprite);
      }
    }
  </script>
</body>
</html>
