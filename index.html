<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>生物・植物用 タッチ選択切抜き＆3D立体観察ノート</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    body { touch-action: manipulation; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
    .canvas-container canvas { touch-action: none; }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col p-3">

  <header class="p-2 border-b border-slate-700 flex justify-between items-center mb-2">
    <h1 class="text-sm md:text-base font-bold text-emerald-400">理科用 生物・植物3Dオブジェクト立体観察</h1>
    <span class="text-xs bg-emerald-900 text-emerald-200 px-2.5 py-0.5 rounded-full">対象物タップ選択対応</span>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto grid grid-cols-1 md:grid-cols-3 gap-3">

    <!-- 左側：写真撮影・選択・削除エリア -->
    <div class="bg-slate-800 p-3 rounded-2xl border border-slate-700 flex flex-col space-y-3">
      
      <!-- 撮影ガイド指示 -->
      <div class="bg-slate-900 p-3 rounded-xl border border-slate-700">
        <div class="text-xs text-emerald-300 font-bold mb-1">撮影・選択手順:</div>
        <div id="guideInstruction" class="text-sm font-extrabold text-amber-300">
          ① 【正面】から生物・植物を撮影してください
        </div>
        <div class="text-[10px] text-slate-400 mt-1">※撮影後、写真内の「観察したい生き物」を指でタップすると綺麗に背景が消えます。</div>
      </div>

      <div>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoCapture(event)">
        <label for="cameraInput" class="w-full bg-emerald-600 active:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl text-xs flex items-center justify-center space-x-2 cursor-pointer shadow">
          <span>📷 観察対象を撮影する</span>
        </label>
      </div>

      <!-- 写真リスト ＆ タップ切り抜きモータル -->
      <div class="flex-1 flex flex-col">
        <div class="text-xs font-bold text-slate-300 mb-1 flex justify-between items-center">
          <span>観察写真（個別に削除可能）</span>
          <span id="angleCount" class="text-emerald-400 font-mono">0 枚</span>
        </div>
        <div id="photoListGrid" class="grid grid-cols-2 gap-2 p-2 bg-slate-950 rounded-xl border border-slate-800 min-h-[140px] max-h-[200px] overflow-y-auto">
          <span class="col-span-2 text-[11px] text-slate-500 text-center self-center">撮影した写真が並びます。<br>失敗した写真は「削除」できます。</span>
        </div>
      </div>

      <button id="generateARBtn" onclick="buildBio3DScene()" disabled class="w-full bg-indigo-600 active:bg-indigo-700 disabled:bg-slate-700 disabled:text-slate-500 text-white font-bold py-3 rounded-xl text-xs transition shadow flex items-center justify-center space-x-1">
        <span>✨ 切り抜いた対象を立体（3D）化</span>
      </button>
    </div>

    <!-- 右側：3D表示空間 -->
    <div class="md:col-span-2 bg-slate-950 rounded-2xl border border-slate-800 relative overflow-hidden flex flex-col min-h-[380px]">
      <div id="webglContainer" class="canvas-container w-full h-full flex-1"></div>
      
      <div class="absolute bottom-3 left-3 bg-slate-900/90 backdrop-blur-md px-3 py-1.5 rounded-lg text-[11px] text-slate-300 border border-slate-700 pointer-events-none">
        👉 画面を回転させると、撮影したアングルの画像（背景除去済）へ自動切替表示されます
      </div>
    </div>

  </main>

  <!-- タップ切り抜き選択ダイアログ -->
  <div id="cropModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 max-w-lg w-full flex flex-col space-y-3">
      <div class="text-sm font-bold text-emerald-300">👉 観察したい対象（虫・植物）の中心を指でタップしてください</div>
      <div class="relative bg-black rounded-xl overflow-hidden flex justify-center items-center max-h-[60vh]">
        <canvas id="modalCanvas" class="max-w-full max-h-[60vh] object-contain cursor-crosshair" onclick="handleTargetTap(event)"></canvas>
      </div>
      <div class="flex justify-between items-center pt-2">
        <span class="text-xs text-slate-400">タップすると周囲の背景が自動除去されます</span>
        <button onclick="closeModal()" class="bg-slate-700 hover:bg-slate-600 text-white text-xs px-4 py-2 rounded-lg font-bold">完了</button>
      </div>
    </div>
  </div>

  <script>
    let scene, camera, renderer, controls;
    let spriteMeshMap = {}; 
    let activeSprite = null;

    const captureSteps = [
      { name: "① 【正面】から撮ってください", tag: "正面" },
      { name: "② 【右側】から撮ってください", tag: "右" },
      { name: "③ 【左側】から撮ってください", tag: "左" },
      { name: "④ 【上または下】から撮ってください", tag: "上・下" }
    ];

    let capturedPhotos = []; 
    let photoIdCounter = 0;
    let currentProcessingPhoto = null;

    window.addEventListener('DOMContentLoaded', () => {
      initThreeJS();
    });

    function initThreeJS() {
      const container = document.getElementById('webglContainer');
      const width = container.clientWidth || window.innerWidth;
      const height = container.clientHeight || 380;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x020617);

      camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
      camera.position.set(0, 0, 20);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(width, height);
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
      scene.add(ambientLight);

      const grid = new THREE.GridHelper(30, 12, 0x1e293b, 0x0f172a);
      grid.position.y = -5;
      scene.add(grid);

      window.addEventListener('resize', onWindowResize, false);
      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      if (controls) controls.update();
      if (activeSprite && camera) {
        const theta = Math.atan2(camera.position.x, camera.position.z);
        updateActiveAngleView(theta);
      }
      if (renderer && scene && camera) renderer.render(scene, camera);
    }

    function onWindowResize() {
      const container = document.getElementById('webglContainer');
      if (!container || !renderer || !camera) return;
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    // 撮影＆モーダルで指定タップを開始
    function handlePhotoCapture(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        photoIdCounter++;
        const step = captureSteps[Math.min(capturedPhotos.length, captureSteps.length - 1)];

        currentProcessingPhoto = {
          id: photoIdCounter,
          tag: step.tag,
          originalSrc: e.target.result,
          processedSrc: e.target.result // 初期状態
        };

        openCropModal(e.target.result);
      };
      reader.readAsDataURL(file);
      event.target.value = '';
    }

    // 切り抜きモーダル表示
    function openCropModal(imgSrc) {
      const modal = document.getElementById('cropModal');
      const canvas = document.getElementById('modalCanvas');
      const ctx = canvas.getContext('2d');
      const img = new Image();

      img.onload = () => {
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
        modal.classList.remove('hidden');
      };
      img.src = imgSrc;
    }

    // ユーザーが対象物を直接タップした位置を中心にして背景を除去（色・領域自動抽出）
    function handleTargetTap(event) {
      const canvas = document.getElementById('modalCanvas');
      const ctx = canvas.getContext('2d');
      const rect = canvas.getBoundingClientRect();

      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      const tapX = Math.floor((event.clientX - rect.left) * scaleX);
      const tapY = Math.floor((event.clientY - rect.top) * scaleY);

      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;

      // タップされた位置の色情報
      const targetIdx = (tapY * canvas.width + tapX) * 4;
      const targetR = data[targetIdx];
      const targetG = data[targetIdx + 1];
      const targetB = data[targetIdx + 2];

      // タップ位置の対象物以外の外周背景を除去
      const maxDistance = Math.min(canvas.width, canvas.height) * 0.4;

      for (let y = 0; y < canvas.height; y++) {
        for (let x = 0; x < canvas.width; x++) {
          const idx = (y * canvas.width + x) * 4;
          const distFromTap = Math.sqrt(Math.pow(x - tapX, 2) + Math.pow(y - tapY, 2));

          // タップ位置から離れた色差の大きい部分（背景）を透過
          const colorDiff = Math.abs(data[idx] - targetR) + Math.abs(data[idx+1] - targetG) + Math.abs(data[idx+2] - targetB);
          
          if (distFromTap > maxDistance || colorDiff > 120) {
            data[idx + 3] = 0; // 背景消去
          }
        }
      }

      ctx.putImageData(imgData, 0, 0);
      currentProcessingPhoto.processedSrc = canvas.toDataURL('image/png');
    }

    function closeModal() {
      document.getElementById('cropModal').classList.add('hidden');
      if (currentProcessingPhoto) {
        capturedPhotos.push(currentProcessingPhoto);
        currentProcessingPhoto = null;
        updatePhotoListUI();
        updateGuideText();
      }
    }

    function deletePhoto(id) {
      capturedPhotos = capturedPhotos.filter(p => p.id !== id);
      updatePhotoListUI();
      updateGuideText();
    }

    function updatePhotoListUI() {
      const grid = document.getElementById('photoListGrid');
      const btn = document.getElementById('generateARBtn');
      document.getElementById('angleCount').innerText = `${capturedPhotos.length} 枚`;

      if (capturedPhotos.length === 0) {
        grid.innerHTML = '<span class="col-span-2 text-[11px] text-slate-500 text-center self-center">撮影した写真が並びます。</span>';
        btn.disabled = true;
        return;
      }

      grid.innerHTML = '';
      capturedPhotos.forEach((photo, index) => {
        const card = document.createElement('div');
        card.className = 'relative bg-slate-900 border border-slate-700 rounded-lg p-1.5 flex items-center space-x-2';
        card.innerHTML = `
          <img src="${photo.processedSrc}" class="w-10 h-10 object-contain rounded bg-slate-950 border border-slate-800 flex-shrink-0" />
          <div class="flex-1 min-w-0">
            <div class="text-[10px] font-bold text-emerald-300 truncate">${index + 1}. ${photo.tag}</div>
            <button onclick="deletePhoto(${photo.id})" class="text-[10px] bg-red-900/60 hover:bg-red-800 text-red-200 px-1.5 py-0.5 rounded mt-0.5">
              削除
            </button>
          </div>
        `;
        grid.appendChild(card);
      });

      btn.disabled = capturedPhotos.length < 1;
    }

    function updateGuideText() {
      const guideEl = document.getElementById('guideInstruction');
      if (capturedPhotos.length < captureSteps.length) {
        guideEl.innerText = captureSteps[capturedPhotos.length].name;
      } else {
        guideEl.innerText = "必要数が揃いました！「立体化」を押してください。";
      }
    }

    // ビルボード型3D構築（板の突起・歪み防止）
    function buildBio3DScene() {
      if (activeSprite) scene.remove(activeSprite);

      const textureLoader = new THREE.TextureLoader();
      spriteMeshMap = {};

      capturedPhotos.forEach(photo => {
        const texture = textureLoader.load(photo.processedSrc);
        const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
        const sprite = new THREE.Sprite(material);
        sprite.scale.set(8, 8, 1);

        spriteMeshMap[photo.tag] = sprite;
      });

      if (capturedPhotos.length > 0) {
        activeSprite = spriteMeshMap[capturedPhotos[0].tag] || Object.values(spriteMeshMap)[0];
        scene.add(activeSprite);
      }
    }

    function updateActiveAngleView(theta) {
      if (!spriteMeshMap || Object.keys(spriteMeshMap).length === 0) return;

      let selectedTag = '正面';
      if (theta > Math.PI / 4 && theta < (3 * Math.PI) / 4 && spriteMeshMap['右']) {
        selectedTag = '右';
      } else if (theta < -Math.PI / 4 && theta > (-3 * Math.PI) / 4 && spriteMeshMap['左']) {
        selectedTag = '左';
      } else if ((theta >= (3 * Math.PI) / 4 || theta <= (-3 * Math.PI) / 4) && spriteMeshMap['上・下']) {
        selectedTag = '上・下';
      }

      if (spriteMeshMap[selectedTag] && activeSprite !== spriteMeshMap[selectedTag]) {
        scene.remove(activeSprite);
        activeSprite = spriteMeshMap[selectedTag];
        scene.add(activeSprite);
      }
    }
  </script>
</body>
</html>
